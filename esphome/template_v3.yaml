# Device-specific ESPHome configuration.
# Shared Toshiba entities and controller settings come from package.yaml.

substitutions:
  deviceid: "ac_unit"
  device_name: "ac-unit"
  devicename: "AC Unit"
  smart_thermostat_multiplier: "3"
  smart_thermostat_runaway_protection: "true"
  disable_cooling_modes: "false"

packages:
  toshiba:
    url: https://github.com/Broxon/esphome-toshiba-shorai-curve
    ref: main
    files:
      - esphome/package.yaml
    refresh: 1s

esphome:
  name: ${device_name}
  friendly_name: ${devicename}

api:
  encryption:
    key: !secret api_key

safe_mode:
  num_attempts: 5
  reboot_timeout: 10min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${devicename} Fallback"
    password: !secret wifi_fallback_password

captive_portal:
